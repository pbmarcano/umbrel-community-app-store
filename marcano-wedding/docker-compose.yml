# Umbrel Community App Store — Lauren & Pete's Wedding
#
# Umbrel automatically injects an `app_proxy` container in front of this stack. It is the
# only user-facing entry point: it listens on the `port:` declared in umbrel-app.yml and
# forwards to APP_HOST:APP_PORT below. The `web` service therefore publishes NO ports itself.

version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: marcano-wedding_web_1
      # Thruster (the image's default web front) listens on 80 inside the container.
      APP_PORT: 80

  web:
    image: pbmarcano/wedding:latest
    # Umbrel owns ${APP_DATA_DIR} as uid/gid 1000; the image's `rails` user is already
    # 1000:1000, so this keeps SQLite + Active Storage writable on the bind mount below.
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      # Decrypts credentials.yml.enc (secret_key_base, SMTP, admin auth). The VALUE is not
      # here — exports.sh reads it from a file on your box (${APP_DATA_DIR}/data/master.key)
      # and sets RAILS_MASTER_KEY at start time. So this file carries no secret; git and the
      # public image never see the key. If the file is missing, this is empty and Rails won't
      # boot (by design). See README.md.
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}

      # --- Serve over plain HTTP behind Umbrel's app_proxy (no TLS on the LAN) ---
      # These flip the two SSL settings in config/environments/production.rb. Leaving them
      # on over HTTP marks session cookies Secure, so magic-link login silently fails.
      RAILS_ASSUME_SSL: "false"
      RAILS_FORCE_SSL: "false"

      # --- Make generated links (magic-link emails, Turbo-broadcast image URLs) point here ---
      # These only affect absolute URLs built OUTSIDE a request (mailer links + broadcast
      # Active Storage image URLs). In-request feed images are relative and unaffected.
      #
      # DEFAULT: public access via Cloudflare Tunnel on the real domain.
      # PROTOCOL is "https" so emailed links and broadcast <img> URLs aren't blocked as mixed
      # content on the HTTPS page. Cloudflare terminates TLS at its edge and forwards plain
      # HTTP to the container, so RAILS_ASSUME_SSL/RAILS_FORCE_SSL above stay "false".
      # No RAILS_URL_PORT — 443 is implied for https.
      RAILS_URL_HOST: "laurenandpete.com"
      RAILS_URL_PROTOCOL: "https"
      #
      # LAN-only alternative (Umbrel app_proxy, no tunnel): comment out the two lines above
      # and use these instead. ${APP_DOMAIN} resolves to a bare "<hostname>.local" (verified
      # in umbreld's app-script: `$(hostname -s).local`); RAILS_URL_PORT must match `port:`
      # in umbrel-app.yml. Links then render as http://<hostname>.local:8927/...
      # RAILS_URL_HOST: ${APP_DOMAIN}
      # RAILS_URL_PROTOCOL: "http"
      # RAILS_URL_PORT: "8927"

      # --- Background jobs (digest email, video normalization, magic-link sends) ---
      # Run the Solid Queue supervisor inside Puma so a single container also processes jobs.
      SOLID_QUEUE_IN_PUMA: "true"

      # Modest process count for a home server (CRuby's GVL means processes, not threads,
      # parallelize Ruby work). Bump if your Umbrel box has spare cores.
      WEB_CONCURRENCY: "2"

      # NOTE: jemalloc is intentionally NOT set via LD_PRELOAD here. bin/docker-entrypoint
      # auto-detects the correct-arch libjemalloc path when LD_PRELOAD is unset — hardcoding
      # the x86_64 path would break jemalloc on an ARM (Raspberry Pi) Umbrel.

      # Match the production upload ceilings (2 GiB/post) and give big mobile videos time
      # to finish uploading before Thruster times out.
      MAX_REQUEST_BODY: "2147483648"
      HTTP_READ_TIMEOUT: "600"

    volumes:
      # ONE bind mount holds everything persistent: the four SQLite DBs (primary, cache,
      # queue, cable) AND all Active Storage photo/video uploads — both live under storage/.
      # (The master key is injected via exports.sh as an env var, not mounted here.)
      - ${APP_DATA_DIR}/data/storage:/rails/storage
