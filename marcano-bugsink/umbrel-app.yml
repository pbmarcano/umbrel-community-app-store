manifestVersion: 1
id: marcano-bugsink
category: developer
name: Bugsink
version: "2.5.1"
tagline: Self-hosted error tracking for your applications
description: >-
  Bugsink collects, groups, and helps you triage application errors while keeping
  the reports on your own Umbrel. It is compatible with Sentry SDKs, including
  the sentry-ruby and sentry-rails gems, so an existing Sentry-style integration
  generally only needs the DSN generated by your Bugsink project.


  This lightweight package uses Bugsink's default SQLite database and automatically
  creates an initial administrator. Sign in as admin@umbrel.local with the password
  shown by Umbrel. Email delivery is not configured by default.


  The default project DSNs use this app's local Umbrel URL. Your Rails application
  must be able to reach that address. Before connecting applications hosted outside
  your home network, configure a stable HTTPS hostname and update Bugsink's BASE_URL
  and proxy mode as described in this package's documentation.


  The app endpoint intentionally bypasses Umbrel's browser authentication because
  Sentry SDKs need to submit events directly. The dashboard remains protected by
  Bugsink's own login, and each ingestion endpoint is authenticated by its project
  DSN.
releaseNotes: >-
  Initial lightweight Umbrel package for Bugsink 2.5.1 with persistent SQLite,
  deterministic credentials, automatic migrations, and SDK-compatible ingress.

